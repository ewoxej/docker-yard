entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'
    transport:
      respondingTimeouts:
        readTimeout: 600s
        writeTimeout: 600s
    http:
      tls:
        certresolver: myresolver
        options: default
        domains:
          - main: example.com
            sans:
              - '*.example.com'

accessLog: {}

api:
  insecure: false
  dashboard: true

certificatesResolvers:
  myresolver:
    acme:
      email: email@example.com
      storage: /keystorage/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"

providers:
  docker:
    exposedByDefault: false
  file:
    directory: conf.d
